<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Produk - Pinku Galeria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Cormorant Garamond"', "serif"],
              sans: ['"Montserrat"', "sans-serif"],
            },
            colors: { "pinku-main": "#f43f5e", "pinku-light": "#fff1f2" },
          },
        },
      };
    </script>
  </head>
  <body class="bg-stone-50 font-sans text-stone-700 flex flex-col min-h-screen">
    <nav class="bg-white sticky top-0 z-50 border-b border-stone-200">
      <div
        class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between"
      >
        <a
          id="backLink"
          href="katalog.html"
          class="flex items-center gap-2 text-stone-500 hover:text-pinku-main transition text-sm font-bold uppercase tracking-widest"
        >
          <span>&larr; Kembali ke Katalog</span>
        </a>
        <span class="font-serif text-xl font-bold tracking-wide"
          >Pinku <span class="text-pinku-main italic">Detail</span></span
        >
      </div>
    </nav>

    <div id="content" class="max-w-4xl mx-auto px-4 py-12 flex-grow w-full">
      <div id="loading" class="text-center py-20">
        <div
          class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-pinku-main mb-2"
        ></div>
        <p class="text-stone-400 font-light text-sm tracking-widest">
          MEMUAT INFO PRODUK...
        </p>
      </div>

      <div
        id="detailWrapper"
        class="hidden bg-white shadow-xl border border-stone-100 p-6 md:p-10"
      >
        <div class="grid md:grid-cols-2 gap-10">
          <div class="relative bg-stone-50 p-2 border border-stone-100">
            <img
              id="dImg"
              src=""
              class="w-full h-auto object-cover shadow-sm"
            />
          </div>

          <div class="flex flex-col">
            <h1
              id="dName"
              class="font-serif text-4xl font-bold text-stone-900 mb-2 leading-tight"
            >
              Nama Produk
            </h1>
            <p id="dPrice" class="text-2xl text-pinku-main font-bold mb-4">
              Rp 0
            </p>

            <div class="flex gap-4 mb-6 border-b border-stone-100 pb-6">
              <button
                id="btnShareWA"
                class="flex items-center gap-2 text-stone-500 hover:text-green-600 transition text-sm font-medium group"
              >
                <i
                  class="fa-brands fa-whatsapp text-lg group-hover:scale-110 transition-transform"
                ></i>
                Bagikan
              </button>
              <button
                id="btnCopyLink"
                class="flex items-center gap-2 text-stone-500 hover:text-pinku-main transition text-sm font-medium group"
              >
                <i
                  class="fa-regular fa-copy text-lg group-hover:scale-110 transition-transform"
                ></i>
                Salin Link
              </button>
            </div>

            <div class="mb-8">
              <h3
                class="text-xs font-bold uppercase tracking-widest text-stone-400 mb-3"
              >
                Deskripsi Produk
              </h3>
              <p
                id="dDesc"
                class="text-stone-600 leading-relaxed font-light text-justify whitespace-pre-line"
              >
                Deskripsi produk akan muncul di sini...
              </p>
            </div>

            <div class="mt-auto">
              <button
                id="btnOrder"
                class="w-full bg-stone-900 text-white font-bold text-sm tracking-[0.2em] py-4 hover:bg-pinku-main transition duration-300 shadow-lg transform hover:-translate-y-1"
              >
                PESAN SEKARANG
              </button>
              <p
                class="text-center text-[10px] text-stone-400 mt-3 uppercase tracking-widest"
              >
                Via WhatsApp Official
              </p>
            </div>
          </div>
        </div>
      </div>

      <div id="errorState" class="hidden text-center py-20">
        <h2 class="font-serif text-2xl text-stone-400">
          Produk tidak ditemukan.
        </h2>
        <a href="katalog.html" class="text-pinku-main underline mt-4 block"
          >Kembali ke Katalog</a
        >
      </div>
    </div>

    <div id="toast">Notifikasi</div>

    <footer
      class="bg-stone-900 text-stone-400 py-8 mt-auto text-center border-t border-stone-800"
    >
      <p class="text-xs tracking-widest">&copy; 2026 Pinku Galeria Florist.</p>
    </footer>

    <script type="module">
      import {
        getProductById,
        formatRupiah,
        initProtection,
        WA_NUMBER,
        shareToWA,
        copyLink,
        showToast,
      } from "./script.js";

      initProtection();

      window.showToast = showToast;

      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get("id");
      const pageNum = urlParams.get("page") || 1;

      document.getElementById("backLink").href = `katalog.html?page=${pageNum}`;

      if (!productId) {
        showError();
      } else {
        loadData(productId);
      }

      async function loadData(id) {
        const product = await getProductById(id);
        document.getElementById("loading").classList.add("hidden");

        if (!product) {
          showError();
          return;
        }

        document.getElementById("detailWrapper").classList.remove("hidden");
        document.getElementById("dImg").src = product.image;
        document.getElementById("dName").innerText = product.name;
        document.getElementById("dPrice").innerText = formatRupiah(
          product.price,
        );
        document.getElementById("dDesc").innerText =
          product.description || "Tidak ada deskripsi tambahan.";
        document.title = `${product.name} - Pinku Galeria`;

        document.getElementById("btnShareWA").onclick = () => {
          shareToWA(product.id, product.name);
        };

        document.getElementById("btnCopyLink").onclick = () => {
          copyLink(product.id);
        };

        document.getElementById("btnOrder").onclick = () => {
          const text = `Halo Pinku Galeria, saya ingin memesan buket *${product.name}* seharga ${formatRupiah(product.price)}. \n\nMohon info ketersediaannya. Terima kasih.`;
          window.open(
            `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(text)}`,
            "_blank",
          );
        };
      }

      function showError() {
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("errorState").classList.remove("hidden");
      }
    </script>
  </body>
</html>
