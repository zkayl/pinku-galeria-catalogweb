<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Pinku Galeria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Cormorant Garamond"', "serif"],
              sans: ['"Montserrat"', "sans-serif"],
            },
            colors: { "pinku-main": "#f43f5e", "pinku-light": "#fff1f2" },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-stone-100 font-sans text-stone-700 flex flex-col min-h-screen"
  >
    <nav class="bg-stone-900 text-white shadow-lg sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <a href="home.html" class="flex items-center gap-2">
            <span class="font-serif text-xl font-bold tracking-wide"
              >Pinku <span class="text-pinku-main italic">Admin</span></span
            >
          </a>

          <div class="hidden md:flex">
            <a
              href="home.html"
              class="text-stone-400 hover:text-white text-xs tracking-widest uppercase transition"
              >Lihat Website</a
            >
          </div>

          <button
            id="mobileMenuBtn"
            class="md:hidden text-stone-400 focus:outline-none p-2"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              ></path>
            </svg>
          </button>
        </div>
      </div>

      <div
        id="mobileMenu"
        class="hidden md:hidden bg-stone-800 border-t border-stone-700 absolute w-full left-0 z-40"
      >
        <a
          href="home.html"
          class="block py-3 px-6 text-xs font-bold uppercase tracking-widest text-stone-400 hover:text-white hover:bg-stone-700"
          >Kembali ke Website</a
        >
      </div>
    </nav>

    <div
      id="loginSection"
      class="flex-grow flex items-center justify-center p-4"
    >
      <div
        class="bg-white p-10 shadow-2xl w-full max-w-md border-t-4 border-pinku-main"
      >
        <h2
          class="text-3xl font-serif font-bold text-center mb-8 text-stone-900"
        >
          Akses Admin
        </h2>
        <div class="mb-6">
          <label
            class="block text-xs font-bold uppercase tracking-widest text-stone-500 mb-2"
            >Password</label
          >
          <input
            type="password"
            id="adminPass"
            class="w-full bg-stone-50 border p-4 focus:outline-none focus:border-pinku-main transition"
            placeholder="••••••••"
          />
        </div>
        <button
          id="btnLogin"
          class="w-full bg-stone-900 text-white font-bold text-sm tracking-widest py-4 hover:bg-pinku-main transition duration-300"
        >
          MASUK DASHBOARD
        </button>
      </div>
    </div>

    <div
      id="dashboardSection"
      class="hidden max-w-7xl mx-auto px-4 py-12 w-full flex-grow relative"
    >
      <div
        class="flex justify-between items-center mb-10 border-b border-stone-200 pb-4"
      >
        <h2 class="text-3xl font-serif font-bold text-stone-900 italic">
          Manajemen Koleksi
        </h2>
        <button
          id="btnLogout"
          class="text-pinku-main hover:text-red-700 text-xs font-bold uppercase tracking-widest"
        >
          Logout
        </button>
      </div>

      <div
        class="bg-white p-8 shadow-xl border border-stone-100 mb-12 relative"
      >
        <div
          id="loadingOverlay"
          class="hidden absolute inset-0 bg-white/90 flex items-center justify-center z-10 backdrop-blur-sm"
        >
          <div
            class="text-pinku-main font-bold animate-pulse text-sm tracking-widest uppercase"
          >
            Sedang Memproses...
          </div>
        </div>

        <h3
          class="font-bold text-sm uppercase tracking-widest mb-6 text-stone-400"
        >
          Tambah Produk Baru
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <input
            type="text"
            id="newName"
            placeholder="Nama Produk"
            class="bg-stone-50 border p-3 focus:outline-none focus:border-pinku-main transition"
          />
          <input
            type="number"
            id="newPrice"
            placeholder="Harga (Rp)"
            class="bg-stone-50 border p-3 focus:outline-none focus:border-pinku-main transition"
          />
          <div>
            <input
              type="file"
              id="newImageFile"
              accept="image/*"
              class="w-full text-xs text-stone-500 file:mr-4 file:py-2 file:px-4 file:border-0 file:text-xs file:font-bold file:bg-stone-100 file:text-stone-700 hover:file:bg-pinku-main hover:file:text-white transition"
            />
          </div>
          <textarea
            id="newDesc"
            rows="5"
            placeholder="Deskripsi Lengkap (Tekan Enter untuk baris baru)"
            class="bg-stone-50 border p-3 md:col-span-2 focus:outline-none focus:border-pinku-main transition resize-none"
          ></textarea>
        </div>
        <button
          id="btnSave"
          class="mt-8 bg-stone-900 text-white px-8 py-3 text-sm font-bold tracking-widest hover:bg-pinku-main transition duration-300 w-full md:w-auto"
        >
          SIMPAN PRODUK
        </button>
      </div>

      <div class="bg-white shadow-xl border border-stone-100 overflow-hidden">
        <div class="p-6 border-b border-stone-100 bg-stone-50">
          <input
            type="text"
            id="adminSearch"
            placeholder="Cari nama produk..."
            class="w-full md:w-1/3 bg-white border border-stone-300 p-3 rounded-none focus:outline-none focus:border-pinku-main transition text-sm"
          />
        </div>

        <div
          class="hidden md:grid md:grid-cols-[100px_1fr_150px_150px] bg-stone-100 text-stone-500 text-xs uppercase tracking-widest border-b"
        >
          <div class="p-5 font-medium">Foto</div>
          <div class="p-5 font-medium">Detail Produk</div>
          <div class="p-5 font-medium">Harga</div>
          <div class="p-5 text-right font-medium">Kontrol</div>
        </div>

        <div id="adminProductList">
          <div class="p-8 text-center text-stone-400 italic">
            Memuat data...
          </div>
        </div>

        <div
          id="adminPagination"
          class="p-6 border-t border-stone-100 flex justify-center gap-2 bg-stone-50"
        ></div>
      </div>
    </div>

    <div
      id="editModal"
      class="hidden fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4"
    >
      <div
        class="bg-white w-full max-w-2xl p-8 rounded-lg shadow-2xl relative max-h-[90vh] overflow-y-auto"
      >
        <button
          id="btnCloseEdit"
          class="absolute top-4 right-4 text-stone-400 hover:text-stone-800 text-xl font-bold"
        >
          &times;
        </button>

        <h3 class="font-serif text-2xl font-bold text-stone-900 mb-6 italic">
          Edit Produk
        </h3>

        <input type="hidden" id="editId" />

        <div class="space-y-4">
          <div>
            <label
              class="block text-xs font-bold uppercase tracking-widest text-stone-500 mb-1"
              >Nama Produk</label
            >
            <input
              type="text"
              id="editName"
              class="w-full bg-stone-50 border p-3 focus:outline-none focus:border-pinku-main transition"
            />
          </div>

          <div>
            <label
              class="block text-xs font-bold uppercase tracking-widest text-stone-500 mb-1"
              >Harga (Rp)</label
            >
            <input
              type="number"
              id="editPrice"
              class="w-full bg-stone-50 border p-3 focus:outline-none focus:border-pinku-main transition"
            />
          </div>

          <div>
            <label
              class="block text-xs font-bold uppercase tracking-widest text-stone-500 mb-1"
              >Deskripsi</label
            >
            <textarea
              id="editDesc"
              rows="5"
              class="w-full bg-stone-50 border p-3 focus:outline-none focus:border-pinku-main transition resize-none"
            ></textarea>
          </div>

          <div>
            <label
              class="block text-xs font-bold uppercase tracking-widest text-stone-500 mb-1"
              >Ganti Foto (Opsional)</label
            >
            <input
              type="file"
              id="editImageFile"
              accept="image/*"
              class="w-full text-xs text-stone-500 file:mr-4 file:py-2 file:px-4 file:border-0 file:text-xs file:font-bold file:bg-stone-100 file:text-stone-700 hover:file:bg-pinku-main hover:file:text-white transition"
            />
            <p class="text-[10px] text-stone-400 mt-1 italic">
              *Biarkan kosong jika tidak ingin mengganti foto.
            </p>
          </div>
        </div>

        <div class="mt-8 flex justify-end gap-3">
          <button
            id="btnCancelEdit"
            class="px-6 py-2 border border-stone-300 text-stone-600 font-bold text-sm tracking-widest hover:bg-stone-100 transition"
          >
            BATAL
          </button>
          <button
            id="btnUpdate"
            class="px-6 py-2 bg-pinku-main text-white font-bold text-sm tracking-widest hover:bg-pinku-dark transition"
          >
            SIMPAN PERUBAHAN
          </button>
        </div>
      </div>
    </div>

    <div id="toast">Notifikasi</div>
    <footer
      class="bg-stone-900 text-stone-400 py-8 mt-auto text-center border-t border-stone-800"
    >
      <p class="text-xs tracking-widest">&copy; 2026 Pinku Galeria Admin.</p>
    </footer>

    <script type="module">
      import {
        addProductToDB,
        deleteProductFromDB,
        updateProductInDB,
        subscribeToProducts,
        formatRupiah,
        showToast,
        compressImage,
        setupMobileMenu,
        initProtection,
      } from "./script.js";
      setupMobileMenu();
      initProtection();

      const btnLogin = document.getElementById("btnLogin");
      const btnLogout = document.getElementById("btnLogout");
      const adminPassInput = document.getElementById("adminPass");

      let allAdminProducts = [];
      let currentAdminPage = 1;
      const adminItemsPerPage = 10;

      function doLogin() {
        const pass = adminPassInput.value;
        if (pass === "admin123") {
          document.getElementById("loginSection").classList.add("hidden");
          document
            .getElementById("dashboardSection")
            .classList.remove("hidden");
          showToast("Selamat Datang, Admin!");

          subscribeToProducts(handleDataUpdate);
        } else {
          alert("Password Salah!");
        }
      }

      btnLogin.addEventListener("click", doLogin);
      adminPassInput.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          doLogin();
        }
      });

      btnLogout.addEventListener("click", () => {
        location.reload();
      });

      window.deleteProductWrapper = (id) => {
        deleteProductFromDB(id);
      };

      function handleDataUpdate(products) {
        allAdminProducts = products;
        updateAdminView();
      }

      document.getElementById("adminSearch").addEventListener("keyup", () => {
        currentAdminPage = 1;
        updateAdminView();
      });

      function updateAdminView() {
        const searchQuery = document
          .getElementById("adminSearch")
          .value.toLowerCase();
        const container = document.getElementById("adminProductList");
        const paginationContainer = document.getElementById("adminPagination");

        const filteredProducts = allAdminProducts.filter((p) =>
          p.name.toLowerCase().includes(searchQuery),
        );

        const totalPages = Math.ceil(
          filteredProducts.length / adminItemsPerPage,
        );

        if (currentAdminPage > totalPages && totalPages > 0)
          currentAdminPage = totalPages;
        if (currentAdminPage < 1) currentAdminPage = 1;

        const startIndex = (currentAdminPage - 1) * adminItemsPerPage;
        const endIndex = startIndex + adminItemsPerPage;
        const pageItems = filteredProducts.slice(startIndex, endIndex);

        container.innerHTML = "";

        if (pageItems.length === 0) {
          container.innerHTML =
            '<div class="p-8 text-center text-stone-400 italic">Tidak ada produk ditemukan.</div>';
        } else {
          pageItems.forEach((p) => {
            container.innerHTML += `
                        <div class="border-b border-stone-50 hover:bg-stone-50 transition p-4 md:p-0">
                            <div class="flex md:grid md:grid-cols-[100px_1fr_150px_150px] items-center">
                                <div class="flex-shrink-0 md:p-5">
                                    <img src="${p.image}" class="w-20 h-20 md:w-16 md:h-16 object-cover rounded shadow-sm">
                                </div>
                                <div class="flex-grow ml-4 md:ml-0 md:p-5">
                                    <div class="font-serif font-bold text-lg text-stone-800">${p.name}</div>
                                    <div class="text-xs text-stone-500 mt-1 line-clamp-2 md:hidden">${p.description}</div>
                                    <div class="flex justify-between items-center mt-2 md:hidden">
                                        <div class="text-sm font-medium text-stone-600">${formatRupiah(p.price)}</div>
                                        <div class="flex gap-2">
                                            <button onclick="window.openEditModal('${p.id}')" class="text-stone-500 hover:text-pinku-main text-xs font-bold uppercase tracking-widest">Edit</button>
                                            <button onclick="window.deleteProductWrapper('${p.id}')" class="text-stone-400 hover:text-red-500 text-xs font-bold uppercase tracking-widest">Hapus</button>
                                        </div>
                                    </div>
                                </div>
                                <div class="hidden md:block md:p-5 text-sm font-medium text-stone-600">
                                    ${formatRupiah(p.price)}
                                </div>
                                <div class="hidden md:block md:p-5 text-right space-x-2">
                                    <button onclick="window.openEditModal('${p.id}')" class="text-stone-500 hover:text-pinku-main text-xs font-bold uppercase tracking-widest transition border border-stone-200 px-3 py-1 hover:border-pinku-main">Edit</button>
                                    <button onclick="window.deleteProductWrapper('${p.id}')" class="text-stone-400 hover:text-red-500 text-xs font-bold uppercase tracking-widest transition border border-stone-200 px-3 py-1 hover:border-red-500">Hapus</button>
                                </div>
                            </div>
                        </div>
                    `;
          });
        }

        paginationContainer.innerHTML = "";
        if (totalPages > 1) {
          if (currentAdminPage > 1) {
            paginationContainer.innerHTML += `<button onclick="window.changeAdminPage(${currentAdminPage - 1})" class="px-3 py-1 border border-stone-300 text-stone-600 hover:bg-stone-200 text-xs font-bold">&lt;</button>`;
          }

          for (let i = 1; i <= totalPages; i++) {
            const activeClass =
              i === currentAdminPage
                ? "bg-pinku-main text-white border-pinku-main"
                : "bg-white text-stone-600 border-stone-300 hover:bg-stone-100";
            paginationContainer.innerHTML += `<button onclick="window.changeAdminPage(${i})" class="px-3 py-1 border ${activeClass} text-xs font-bold">${i}</button>`;
          }

          if (currentAdminPage < totalPages) {
            paginationContainer.innerHTML += `<button onclick="window.changeAdminPage(${currentAdminPage + 1})" class="px-3 py-1 border border-stone-300 text-stone-600 hover:bg-stone-200 text-xs font-bold">&gt;</button>`;
          }
        }
      }

      window.changeAdminPage = (page) => {
        currentAdminPage = page;
        updateAdminView();

        document
          .getElementById("adminProductList")
          .scrollIntoView({ behavior: "smooth" });
      };

      window.openEditModal = (id) => {
        const product = allAdminProducts.find((p) => p.id === id);
        if (product) {
          document.getElementById("editId").value = product.id;
          document.getElementById("editName").value = product.name;
          document.getElementById("editPrice").value = product.price;
          document.getElementById("editDesc").value = product.description || "";
          document.getElementById("editImageFile").value = "";
          document.getElementById("editModal").classList.remove("hidden");
        }
      };

      const modal = document.getElementById("editModal");
      document.getElementById("btnCloseEdit").onclick = () =>
        modal.classList.add("hidden");
      document.getElementById("btnCancelEdit").onclick = () =>
        modal.classList.add("hidden");

      document
        .getElementById("btnUpdate")
        .addEventListener("click", async () => {
          const id = document.getElementById("editId").value;
          const name = document.getElementById("editName").value;
          const price = document.getElementById("editPrice").value;
          const desc = document.getElementById("editDesc").value;
          const fileInput = document.getElementById("editImageFile");

          if (!name || !price) {
            alert("Nama dan Harga tidak boleh kosong!");
            return;
          }

          const btnUpdate = document.getElementById("btnUpdate");
          const originalText = btnUpdate.innerText;
          btnUpdate.innerText = "MENYIMPAN...";
          btnUpdate.disabled = true;

          const updateData = {
            name,
            price: parseInt(price),
            description: desc,
          };

          if (fileInput.files[0]) {
            compressImage(fileInput.files[0], async (base64Image) => {
              updateData.image = base64Image;
              await processUpdate(id, updateData, btnUpdate, originalText);
            });
          } else {
            await processUpdate(id, updateData, btnUpdate, originalText);
          }
        });

      async function processUpdate(id, data, btn, originalText) {
        const result = await updateProductInDB(id, data);
        btn.innerText = originalText;
        btn.disabled = false;
        if (result.success) {
          showToast("Produk Berhasil Diupdate!");
          document.getElementById("editModal").classList.add("hidden");
        } else {
          alert("Gagal update produk.");
        }
      }

      document.getElementById("btnSave").addEventListener("click", () => {
        const name = document.getElementById("newName").value;
        const price = document.getElementById("newPrice").value;
        const desc = document.getElementById("newDesc").value;
        const fileInput = document.getElementById("newImageFile");

        if (!name || !price || !fileInput.files[0]) {
          alert("Mohon lengkapi semua data!");
          return;
        }
        document.getElementById("loadingOverlay").classList.remove("hidden");
        compressImage(fileInput.files[0], async (base64Image) => {
          const result = await addProductToDB({
            name,
            price: parseInt(price),
            description: desc,
            image: base64Image,
          });
          document.getElementById("loadingOverlay").classList.add("hidden");
          if (result.success) {
            showToast("Produk Berhasil Ditambahkan!");
            document.getElementById("newName").value = "";
            document.getElementById("newPrice").value = "";
            document.getElementById("newDesc").value = "";
            document.getElementById("newImageFile").value = "";
          } else {
            alert("Gagal koneksi database.");
          }
        });
      });
    </script>
  </body>
</html>
