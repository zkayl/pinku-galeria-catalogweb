<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Katalog Bunga Artifisial Premium - Pinku Galeria</title>
    <meta
      name="description"
      content="Katalog Pinku Galeria. Temukan buket bunga artifisial, bunga imitasi premium, dan hadiah wisuda/ulang tahun yang tahan lama dan estetik."
    />
    <meta
      name="keywords"
      content="buket malang, bouquet malang, florist malang, toko bunga malang, kado wisuda malang, buket bunga artifisial, bunga palsu premium, pinku galeria, buket murah malang"
    />
    <meta name="author" content="Pinku Galeria" />

    <meta property="og:title" content="Katalog Pinku Galeria - Bunga Abadi" />
    <meta
      property="og:description"
      content="Koleksi bunga artifisial premium yang cantik selamanya tanpa layu."
    />
    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1591946693356-d44445831557?auto=format&fit=crop&w=1000&q=80"
    />
    <meta property="og:type" content="website" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Cormorant Garamond"', "serif"],
              sans: ['"Montserrat"', "sans-serif"],
            },
            colors: { "pinku-main": "#f43f5e", "pinku-light": "#fff1f2" },
          },
        },
      };
    </script>
  </head>
  <body class="bg-stone-50 font-sans text-stone-700 flex flex-col min-h-screen">
    <nav
      class="bg-white/90 backdrop-blur-md sticky top-0 z-50 border-b border-stone-100"
    >
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-20">
          <a href="home.html" class="flex items-center gap-2">
            <span
              class="font-serif text-3xl font-bold text-stone-800 tracking-tight"
              >Pinku <span class="text-pinku-main italic">Galeria</span></span
            >
          </a>
          <div class="hidden md:flex space-x-10">
            <a
              href="home.html"
              class="nav-link text-stone-600 hover:text-pinku-main py-2 text-sm font-medium tracking-wide"
              >BERANDA</a
            >
            <a
              href="katalog.html"
              class="text-pinku-main font-bold py-2 text-sm tracking-wide border-b-2 border-pinku-main"
              >KATALOG</a
            >
            <a
              href="tentang.html"
              class="nav-link text-stone-600 hover:text-pinku-main py-2 text-sm font-medium tracking-wide"
              >TENTANG</a
            >
            <a
              href="kontak.html"
              class="nav-link text-stone-600 hover:text-pinku-main py-2 text-sm font-medium tracking-wide"
              >KONTAK</a
            >
          </div>
          <button
            id="mobileMenuBtn"
            class="md:hidden text-stone-600 focus:outline-none p-2"
          >
            <svg
              class="w-8 h-8"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              ></path>
            </svg>
          </button>
        </div>
      </div>
      <div
        id="mobileMenu"
        class="hidden md:hidden bg-white border-t border-stone-100 shadow-lg absolute w-full left-0 z-40"
      >
        <a
          href="home.html"
          class="block py-4 px-6 text-sm font-medium text-stone-600 border-b border-stone-50 hover:bg-pinku-light hover:text-pinku-main"
          >BERANDA</a
        >
        <a
          href="katalog.html"
          class="block py-4 px-6 text-sm font-bold text-pinku-main bg-pinku-light border-b border-stone-50"
          >KATALOG</a
        >
        <a
          href="tentang.html"
          class="block py-4 px-6 text-sm font-medium text-stone-600 border-b border-stone-50 hover:bg-pinku-light hover:text-pinku-main"
          >TENTANG</a
        >
        <a
          href="kontak.html"
          class="block py-4 px-6 text-sm font-medium text-stone-600 hover:bg-pinku-light hover:text-pinku-main"
          >KONTAK</a
        >
      </div>
    </nav>

    <div class="bg-white border-b border-stone-200 py-8">
      <div
        class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-end gap-6"
      >
        <div>
          <h2
            class="text-3xl md:text-4xl font-serif font-bold text-stone-900 italic"
          >
            Koleksi Bunga Abadi
          </h2>
          <p class="text-stone-500 mt-2 font-light text-sm md:text-base">
            Temukan keindahan yang tak lekang oleh waktu.
          </p>
        </div>
        <div class="w-full md:w-1/3">
          <input
            type="text"
            id="searchInput"
            placeholder="Cari nama buket..."
            class="bg-stone-50 border border-stone-200 px-5 py-3 w-full focus:outline-none focus:border-pinku-main focus:ring-1 focus:ring-pinku-main transition-colors text-sm rounded-none"
          />
        </div>
      </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 py-8 flex-grow">
      <div id="loadingText" class="text-center py-20">
        <div
          class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-pinku-main mb-2"
        ></div>
        <p class="text-stone-400 font-light text-sm tracking-widest">
          MEMUAT KOLEKSI...
        </p>
      </div>

      <div
        id="productGrid"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 hidden"
      ></div>

      <div
        id="paginationNav"
        class="flex justify-center items-center gap-2 mt-12 mb-8 hidden"
      ></div>
    </div>

    <div id="toast">Notifikasi</div>

    <footer
      class="bg-stone-900 text-stone-400 py-12 mt-auto border-t border-stone-800"
    >
      <div class="max-w-7xl mx-auto px-4 text-center">
        <p class="text-sm tracking-wider">&copy; 2026 Pinku Galeria Florist.</p>
      </div>
    </footer>

    <script type="module">
      import {
        subscribeToProducts,
        formatRupiah,
        setupMobileMenu,
        initProtection,
        shareToWA,
        copyLink,
        showToast,
      } from "./script.js";

      setupMobileMenu();
      initProtection();

      window.shareToWAWrapper = (id, name) => shareToWA(id, name);
      window.copyLinkWrapper = (id) => copyLink(id);
      window.showToast = showToast;

      let allProducts = [];
      const urlParams = new URLSearchParams(window.location.search);
      let currentPage = parseInt(urlParams.get("page")) || 1;
      const itemsPerPage = 10;

      subscribeToProducts((products) => {
        allProducts = products;
        document.getElementById("loadingText").classList.add("hidden");
        document.getElementById("productGrid").classList.remove("hidden");
        document.getElementById("paginationNav").classList.remove("hidden");
        renderPage();
      });

      document.getElementById("searchInput").addEventListener("keyup", (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allProducts.filter((p) =>
          p.name.toLowerCase().includes(term),
        );
        renderGrid(filtered);
        document.getElementById("paginationNav").innerHTML = "";
      });

      function renderPage() {
        const totalPages = Math.ceil(allProducts.length / itemsPerPage);
        if (currentPage > totalPages && totalPages > 0)
          currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const pageItems = allProducts.slice(startIndex, endIndex);

        renderGrid(pageItems);
        renderPagination();
      }

      function renderPagination() {
        const totalPages = Math.ceil(allProducts.length / itemsPerPage);
        const nav = document.getElementById("paginationNav");
        nav.innerHTML = "";

        if (totalPages <= 1) return;

        if (currentPage > 1) {
          nav.innerHTML += `<button onclick="window.changePage(${currentPage - 1})" class="w-8 h-8 flex items-center justify-center border border-stone-300 text-stone-600 hover:bg-pinku-main hover:text-white transition">&lt;</button>`;
        }

        for (let i = 1; i <= totalPages; i++) {
          const activeClass =
            i === currentPage
              ? "bg-pinku-main text-white border-pinku-main"
              : "bg-white text-stone-600 border-stone-300 hover:bg-stone-100";
          nav.innerHTML += `<button onclick="window.changePage(${i})" class="w-8 h-8 flex items-center justify-center border ${activeClass} transition text-sm font-bold">${i}</button>`;
        }

        if (currentPage < totalPages) {
          nav.innerHTML += `<button onclick="window.changePage(${currentPage + 1})" class="w-8 h-8 flex items-center justify-center border border-stone-300 text-stone-600 hover:bg-pinku-main hover:text-white transition">&gt;</button>`;
        }
      }

      window.changePage = (page) => {
        currentPage = page;
        const newUrl = `${window.location.pathname}?page=${page}`;
        window.history.pushState({ path: newUrl }, "", newUrl);
        renderPage();
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      function renderGrid(items) {
        const grid = document.getElementById("productGrid");
        grid.innerHTML = "";

        if (items.length === 0) {
          grid.innerHTML =
            '<div class="col-span-full text-center text-stone-400 py-20 italic font-serif text-xl">Belum ada koleksi.</div>';
          return;
        }

        items.forEach((p) => {
          grid.innerHTML += `
                    <div class="bg-white border border-stone-100 hover:shadow-lg transition p-3 lg:p-0 flex flex-row lg:flex-col gap-4 lg:gap-0 items-center lg:items-start group h-full relative">
                        
                        <!-- GAMBAR: Lazy Loading dihapus agar kompatibel semua HP -->
                        <div class="w-24 h-24 flex-shrink-0 lg:w-full lg:h-48 overflow-hidden relative bg-stone-100">
                            <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover transition duration-700 ease-in-out group-hover:scale-110">
                            
                            <!-- Overlay Desktop -->
                            <div class="hidden lg:flex absolute inset-0 bg-black/10 opacity-0 group-hover:opacity-100 transition duration-300 items-center justify-center">
                                <button onclick="window.openDetail('${p.id}')" class="bg-white text-xs font-bold px-4 py-2 uppercase tracking-widest hover:bg-pinku-main hover:text-white transition">Lihat Detail</button>
                            </div>
                        </div>

                        <!-- KONTEN -->
                        <div class="flex-grow flex flex-col justify-between lg:p-4 lg:w-full w-full">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-serif font-bold text-lg text-stone-900 leading-tight mb-1 group-hover:text-pinku-main transition-colors line-clamp-1">${p.name}</h3>
                                    <p class="text-pinku-main font-bold text-sm mb-2">${formatRupiah(p.price)}</p>
                                </div>
                                
                                <div class="flex gap-2">
                                    <button onclick="window.shareToWAWrapper('${p.id}', '${p.name}')" class="text-stone-400 hover:text-green-500 transition" title="Share ke WhatsApp">
                                        <i class="fa-brands fa-whatsapp text-lg"></i>
                                    </button>
                                    <button onclick="window.copyLinkWrapper('${p.id}')" class="text-stone-400 hover:text-pinku-main transition" title="Salin Link">
                                        <i class="fa-regular fa-copy text-lg"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <button onclick="window.openDetail('${p.id}')" class="text-xs font-bold uppercase tracking-widest text-stone-400 border border-stone-200 py-2 px-3 hover:bg-stone-900 hover:text-white transition text-center w-full lg:mt-2 mt-auto">
                                Deskripsi Lengkap
                            </button>
                        </div>
                    </div>
                `;
        });
      }

      window.openDetail = (id) => {
        window.location.href = `detail.html?id=${id}&page=${currentPage}`;
      };
    </script>
  </body>
</html>
